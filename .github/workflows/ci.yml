name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request branch lifecycle
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          semver='v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?'

          if [[ "$BASE_BRANCH" == "main" ]]; then
            [[ "$HEAD_BRANCH" =~ ^(release|hotfix)/$semver$ ]] || {
              echo "Pull requests into main must come from release/vX.Y.Z or hotfix/vX.Y.Z." >&2
              exit 1
            }
          elif [[ "$BASE_BRANCH" == "develop" ]]; then
            [[ "$HEAD_BRANCH" == "main" || "$HEAD_BRANCH" =~ ^(feat|fix|docs|chore|codex)/.+$ ]] || {
              echo "Pull requests into develop must come from main or an approved topic branch." >&2
              exit 1
            }
          else
            echo "Pull requests must target main or develop." >&2
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 24]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node src/index.mjs --help

  package-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:package
